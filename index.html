<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnowBall+ — Investing Simulator</title>
  <meta name="description" content="SnowBall+ is a practice simulator for building portfolios, trading stocks, funds and bonds, and following market news. No real money.">
  <meta name="theme-color" content="#87CEEB">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2387CEEB' stroke='%230B2A3C' stroke-width='2'/%3E%3Cpath d='M16 7v18M7 16h18M9.6 9.6l12.8 12.8M22.4 9.6L9.6 22.4' stroke='%230B2A3C' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css?v=1.4.0">
  <link rel="stylesheet" href="css/snowbull.css?v=1.5.2">
</head>
<body>
  <a class="skip" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="#home" aria-label="SnowBall+ home">
        <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="14" fill="#FFFFFF" stroke="#0B2A3C" stroke-width="2"/><path d="M16 7v18M7 16h18M9.6 9.6l12.8 12.8M22.4 9.6L9.6 22.4" stroke="#0B2A3C" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="brand-name">SnowBall<span class="plus">+</span></span>
      </a>
      <form class="search" role="search" data-form="search" autocomplete="off">
        <label class="sr" for="q">Search symbols or company names</label>
        <input id="q" name="q" class="input" type="search" list="symlist" placeholder="Search symbol or name">
        <datalist id="symlist"></datalist>
        <button type="submit" class="btn btn-primary">Search</button>
      </form>
      <div class="tools">
        <div class="field inline">
          <label for="acct-switch">Account</label>
          <select id="acct-switch" class="input"></select>
        </div>
        <button type="button" id="live-toggle" class="btn btn-sm" data-act="live-toggle" aria-pressed="true">Live prices: on</button>
        <div class="row tight" role="group" aria-label="Text size">
          <button type="button" class="btn btn-sm" data-act="fs-down" aria-label="Decrease text size">A−</button>
          <button type="button" class="btn btn-sm" data-act="fs-up" aria-label="Increase text size">A+</button>
        </div>
        <div class="field inline">
          <label for="lang-switch">Language</label>
          <select id="lang-switch" class="input" data-change="lang"><option value="en">English</option><option value="zh-CN">简体中文</option></select>
        </div>
      </div>
    </div>
    <nav id="primary-nav" aria-label="Primary">
      <div class="container">
        <button type="button" id="nav-toggle" class="btn nav-toggle" aria-expanded="false" aria-controls="nav-list">Menu</button>
        <ul id="nav-list"></ul>
      </div>
    </nav>
  </header>

  <main id="main-content" tabindex="-1"></main>

  <div id="toasts" role="status" aria-live="polite"></div>
  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>

  <noscript><p class="container">SnowBall+ needs JavaScript to run.</p></noscript>
  <script src="js/config.js?v=1.4.0"></script>
  <script src="js/data.js?v=1.4.0"></script>
  <script src="js/news.js?v=1.4.0"></script>
  <script src="js/store.js?v=1.4.0"></script>
  <script src="js/live.js?v=1.4.0"></script>
  <script src="js/ui.js?v=1.4.0"></script>
  <script src="js/pages-a.js?v=1.4.0"></script>
  <script src="js/pages-b.js?v=1.4.0"></script>
  <script src="js/i18n.js?v=1.4.0"></script>
  <script src="js/i18n-zh.js?v=1.4.0"></script>
  <script src="js/i18n-packs.js?v=1.4.0"></script>
  <script src="js/app.js?v=1.4.0"></script>
  <script src="js/snowbull-kb.js?v=1.5.2"></script>
  <script src="js/snowbull-core.js?v=1.5.2"></script>
  <script src="js/snowbull-ui.js?v=1.5.2"></script>
  <script src="js/snowbull-embed.js?v=1.5.2"></script>
</body>
</html>
